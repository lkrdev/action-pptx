name: PR Verification

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Check uv.lock index
        run: |
          if grep -Fq "airlock-proxy.uplink" uv.lock || grep -Fq "artifact-foundry-prod" uv.lock; then
            echo "uv.lock must use public PyPI index, not proprietary mirror"
            exit 1
          fi

      - name: Sync Python dependencies
        run: uv sync --frozen

      - name: Run ruff, ty, and pytest
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen ty check
          uv run --frozen pytest --cov=src --cov-report=term-missing

      - name: Build and typecheck Looker Extension
        run: |
          cd extension
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
