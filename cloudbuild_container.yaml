steps:
  # Build the Action Hub container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/action-pptx', '.']
  # Push the container to the container registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/action-pptx']
  - name: 'gcr.io/cloud-builders/gcloud'
    # Deploy the container to Cloud Run
    args:
      - 'run'
      - 'deploy'
      - 'action-pptx'
      - '--image'
      - 'gcr.io/$PROJECT_ID/action-pptx'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: us-central1
images: ['gcr.io/$PROJECT_ID/action-pptx']
