[project]
name = "action-pptx"
version = "0.1.0"
description = "Looker PowerPoint custom action (action-pptx) and standalone pptx_merge library/CLI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "google-auth>=2.35.0",
    "google-cloud-storage>=2.18.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
pptx-merge = "pptx_merge.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27.2",
    "pre-commit>=4.2.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "ty>=0.0.1a0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pptx_merge", "src/action_pptx"]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "ANN401", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Use a concrete type, TypedDict, BaseModel, or object instead of Any."

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
